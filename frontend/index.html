<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟧</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MINA DESIGN - ERP</title>
    <script>
      try { if (localStorage.getItem('mina-theme') !== 'dark') { document.documentElement.classList.add('light'); localStorage.setItem('mina-theme', 'light'); } } catch (e) {}
      window.addEventListener('error', function(e) {
        var errBox = document.getElementById('mina-global-err-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'mina-global-err-box';
          errBox.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#991b1b;color:#fff;padding:24px;z-index:999999;font-family:sans-serif;font-size:14px;overflow:auto;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<h2 style="font-size:18px;font-weight:bold;margin-bottom:12px;">Error detectado en el navegador</h2>' +
          '<p><b>Mensaje:</b> ' + (e.message || 'Error desconocido') + '</p>' +
          '<p><b>Archivo:</b> ' + (e.filename || '') + ' :' + (e.lineno || '') + '</p>' +
          '<pre style="background:rgba(0,0,0,0.4);padding:12px;border-radius:6px;margin-top:12px;">' + (e.error ? (e.error.stack || e.error) : '') + '</pre>';
        try {
          fetch('/api/client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, stack: e.error ? e.error.stack : '' })
          });
        } catch(_) {}
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errBox = document.getElementById('mina-global-err-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'mina-global-err-box';
          errBox.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#991b1b;color:#fff;padding:24px;z-index:999999;font-family:sans-serif;font-size:14px;overflow:auto;';
          document.body.appendChild(errBox);
        }
        var reason = e.reason || 'Unhandled Rejection';
        errBox.innerHTML = '<h2 style="font-size:18px;font-weight:bold;margin-bottom:12px;">Promesa rechazada en el navegador</h2>' +
          '<pre style="background:rgba(0,0,0,0.4);padding:12px;border-radius:6px;margin-top:12px;">' + (reason.stack || String(reason)) + '</pre>';
        try {
          fetch('/api/client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: String(reason), stack: reason && reason.stack ? reason.stack : '' })
          });
        } catch(_) {}
      });
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-th-121314 text-gray-100 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
